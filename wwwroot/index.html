<!DOCTYPE html>
<html>
<head>
    <title>Pharmacy Medicine Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="loadMedicines()">

    <h2>Medicine List</h2>

    <!-- 🔍 Search -->
    <input type="text"
           id="search"
           placeholder="Search by medicine name..."
           onkeyup="loadMedicines()" />

    <!-- 🎨 Legend (optional but good UI) -->
    <p>
        <span style="background:#ffcccc;padding:5px;">Expiry &lt; 30 days</span>
        <span style="background:#fff3cd;padding:5px;margin-left:10px;">Low Stock (&lt;10)</span>
    </p>

    <!-- 📊 Table -->
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Expiry Date</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Brand</th>
            </tr>
        </thead>
        <tbody id="medicineTable"></tbody>
    </table>

    <hr />

    <h2>Add Medicine</h2>

    <!-- 🧾 Form -->
    <input id="name" placeholder="Full Name" />
    <input id="notes" placeholder="Notes" />
    <input id="expiry" type="date" />
    <input id="qty" type="number" placeholder="Quantity" />
    <input id="price" type="number" step="0.01" placeholder="Price" />
    <input id="brand" placeholder="Brand" />

    <br /><br />

    <button onclick="addMedicine()">Add Medicine</button>

    <!-- 📜 JS -->
    <script src="js/app.js"></script>

</body>
</html>
